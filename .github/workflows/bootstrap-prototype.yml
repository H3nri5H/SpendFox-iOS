name: Bootstrap native prototype

on:
  push:
    branches:
      - feature/native-prototype
    paths:
      - .github/workflows/bootstrap-prototype.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/prototype.part*
      - .github/workflows/bootstrap-prototype.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/native-prototype
          fetch-depth: 0

      - name: Detect staging archive
        id: staging
        shell: bash
        run: |
          if compgen -G '.github/prototype.part*' > /dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Reassemble and verify prototype archive
        if: steps.staging.outputs.present == 'true'
        shell: bash
        run: |
          cat .github/prototype.part* > /tmp/spendfox-prototype.tar.gz.b64
          base64 --decode /tmp/spendfox-prototype.tar.gz.b64 > /tmp/spendfox-prototype.tar.gz
          echo "e21e6aa292cfdf70e690f6e6c24b86d76d31edbcdcb7ff5c3c8a750ee050d542  /tmp/spendfox-prototype.tar.gz" | sha256sum --check

      - name: Install prototype files
        if: steps.staging.outputs.present == 'true'
        shell: bash
        run: |
          tar -xzf /tmp/spendfox-prototype.tar.gz
          rm -f .github/prototype.part*
          rm -f .github/workflows/ios.yml

      - name: Commit native prototype
        if: steps.staging.outputs.present == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add native SwiftUI prototype"
          git push origin HEAD:feature/native-prototype
